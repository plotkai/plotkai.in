{{ define "bodyclass" }}inner-page{{ end }}
{{ define "main" }}
<div class="content-page-wrapper">
  <div class="reveal" style="margin-bottom:12px;">
    <span class="badge">{{ if eq .Title "About Us" }}Company{{ else if eq .Title "Contact Us" }}Get in Touch{{ else }}Information{{ end }}</span>
  </div>
  <h1 class="reveal" style="margin-top:16px;">{{ .Title }}</h1>
  <div class="divider reveal"></div>
  <div class="content-body reveal">
    {{ .Content }}
  </div>
</div>
{{ end }}
